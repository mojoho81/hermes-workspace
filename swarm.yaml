version: 1
# Muhammad's swarm — profiles that ACTUALLY exist (hermes profile list).
# Previous upstream example roster saved to swarm.yaml.upstream-example.
workers:
- id: orchestrator
  name: Orchestrator
  role: Mission routing / decomposition / greenlight gate
  specialty: task decomposition, kanban routing, handoffs, human approval gates
  model: claude-fable-5
  mission: Decompose missions into kanban cards routed to real profiles; never execute work itself; preserve Muhammad's greenlight on anything external or destructive.
  profile: orchestrator
  modes: [plan]
  tools: [todo, kanban, delegation, terminal, file, session_search, cronjob, skills, clarify, web]
  skills:
  - kanban-orchestrator
  - working-with-muhammad
  - plan
  - subagent-driven-development
  capabilities: [orchestration, decomposition, routing, greenlight-gate]
  preferredTaskTypes: [orchestration, planning, routing, coordination]
  greenlightRequiredFor: [merge, publish, destructive, external-send, credential-change]
  maxConcurrentTasks: 1
  acceptsBroadcast: true
  plugins: []
  pluginToolsets: []
  mcpServers: []
- id: researcher
